# Font configuration for kitty
# Pattern matches: kitten choose-fonts --config-file-name fonts.conf
#
# Text: JetBrainsMono Nerd Font Mono (already installed via Homebrew)
# Icons: force Kitty's recommended Symbols Nerd Font Mono for PUA glyphs
# (LazyVim / mini.icons / Oh My Posh all depend on these rendering correctly)

font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

# Nerd Fonts v3.4.0 — from https://sw.kovidgoyal.net/kitty/faq/
# Forces icon glyphs to Symbols Nerd Font Mono instead of broken patched ranges.
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono
